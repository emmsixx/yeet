name: Bug report
description: Report unexpected behavior in Yeet.
body:
  - type: input
    id: version
    attributes:
      label: Yeet version and installation method
      placeholder: "yeet --version; source, release archive, or installer"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command, expected behavior, and actual behavior. Remove credentials and private repository content.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      render: text
